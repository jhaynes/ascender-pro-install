{% if k8s_container_registry %}
  image: {{ k8s_container_registry | default("ghcr.io/ctrliq", true)  ~ "/ascender" }}
{% else %}
  image: {{ ASCENDER_IMAGE }}
{% endif %}
  image_version: {{ ASCENDER_VERSION | default("25.6.2") }}
{% if k8s_platform == "k3s" and k8s_offline | default(false) | bool %}
  image_pull_policy: Never
{% else %}
  image_pull_policy: {{ ascender_image_pull_policy | default("Always") }}
{% endif %}
  replicas: {{ ascender_replicas | default(1) }}
{% if ASCENDER_EE_IMAGE_REF is defined %}
  init_container_image: {{ ASCENDER_EE_IMAGE_REF.rsplit('@', 1)[0].rsplit(':', 1)[0] }}
  init_container_image_version: {{ ASCENDER_EE_IMAGE_REF.rsplit('@', 1)[0].rsplit(':', 1)[1] | default('', true) }}@{{ ASCENDER_EE_IMAGE_REF.rsplit('@', 1)[1] }}
{% else %}
  init_container_image: {{ k8s_container_registry | default("ghcr.io/ctrliq", true)  ~ "/ascender-ee" }}
{% endif %}
{% if ASCENDER_EE_IMAGE_VERSION is defined %}
  init_container_image_version: {{ ASCENDER_EE_IMAGE_VERSION }}
{% elif ASCENDER_VERSION is defined and ASCENDER_EE_IMAGE_REF is not defined %}
  init_container_image_version: {{ ASCENDER_VERSION }}
{% endif %}
{% if ASCENDER_EE_IMAGE_REF is defined %}
  control_plane_ee_image: {{ ASCENDER_EE_IMAGE_REF }}
{% else %}
  control_plane_ee_image: {{ k8s_container_registry | default("ghcr.io/ctrliq", true)  ~ "/ascender-ee" }}:{{ ASCENDER_VERSION }}
{% endif %}
# homelab (#121, digest-capable, operator-composition-verified): operator
# 25.6.2 composes each custom image ref as `image + ':' + version` when
# the version is defined and non-empty (roles/installer/tasks/
# database_configuration.yml:59-68, resources_configuration.yml:236-246,
# set_images.yml:3-18 — replicated empirically against those verbatim
# chains). A full digest ref `repo[:tag]@sha256:<hex>` is therefore
# expressed in SPLIT form: `postgres_image: repo[:tag]@sha256` with
# `postgres_image_version: <hex>` (same for redis/EE init), so the
# operator's own concatenation reconstructs the immutable full ref.
# The OMITTED-version form (digest ref, no version line) does NOT pin:
# the PG custom-image branch is skipped and the operator falls back to
# its default `:latest` tag-composed ref; the redis branch references
# an undefined version and errors. Do not pin by omitted version.
  postgres_image: {{ POSTGRES_IMAGE | default(k8s_container_registry | default("quay.io", true)  ~ "/sclorg/postgresql-15-c9s") }}
{% if POSTGRES_IMAGE_VERSION is defined %}
  postgres_image_version: "{{ POSTGRES_IMAGE_VERSION }}"
{% endif %}
  postgres_extra_args:
     - '-c'
     - 'shared_buffers=256MB'
     - '-c'
     - 'max_connections=1000'
{% if POSTGRES_PVC_SIZE_GB is defined %}
  postgres_storage_requirements:
    requests:
      storage: {{ POSTGRES_PVC_SIZE_GB }}Gi
{% endif %}
{% if POSTGRES_STORAGE_CLASS is defined %}
  postgres_storage_class: {{ POSTGRES_STORAGE_CLASS }}
{% endif %}
# homelab (#121, digest-capable): same split form as postgres_image —
# `redis_image: repo[:tag]@sha256` + `redis_image_version: <hex>`
# reconstructs the full digest ref through the operator's concat.
  redis_image: {{ REDIS_IMAGE | default(k8s_container_registry | default("ghcr.io/valkey-io", true)  ~ "/valkey") }}
{% if REDIS_IMAGE_VERSION is defined %}
  redis_image_version: "{{ REDIS_IMAGE_VERSION }}"
{% endif %}
{% if k8s_image_pull_secret is defined and k8s_image_pull_secret != 'None' %}
  image_pull_secret: {{ k8s_image_pull_secret }}
{% endif %}
{% if k8s_ee_pull_credentials_secret is defined and k8s_ee_pull_credentials_secret != 'None'%}
  ee_pull_credentials_secret: {{ k8s_ee_pull_credentials_secret }}
{% endif %}
  redis_capabilities:
   - CHOWN
   - SETUID
   - SETGID
{% if ee_images is defined %}
  ee_images:
{% for ee in ee_images %}
    - name: {{ ee.name }}
      image: {{ ee.image}}
{% endfor %}
{% endif %}
{% if postgres_selector is defined %}
  postgres_selector: |
    {{ postgres_selector | indent(width=4) }}
{% endif %}
{% if node_selector is defined %}
  node_selector: |
    {{ node_selector | indent(width=4) }}
{% endif %}

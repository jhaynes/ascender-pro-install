apiVersion: v1
stringData:
  admin-password: {{ LEDGER_ADMIN_PASSWORD }}
kind: Secret
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: admin-password
  name: admin-password
  namespace: {{ LEDGER_NAMESPACE }}
type: Opaque
---
apiVersion: v1
stringData:
  config.json: |
    {
      "db_host": "{{ LEDGER_DB_HOST }}",
      "db_port": "{{ LEDGER_DB_PORT }}",
      "db_name": "{{ LEDGER_DB_NAME }}",
      "db_username": "{{ LEDGER_DB_USERNAME }}",
      "db_password": "{{ LEDGER_DB_PASSWORD }}"
    }
kind: Secret
metadata:
  labels:
    io.kompose.service: db-settings
  name: db-settings
  namespace: {{ LEDGER_NAMESPACE }}
type: Opaque
# homelab fix (#121): do not render a namespace-local TLS Secret here.
# Upstream built `ascender-tls-secret` from tls_crt_path/tls_key_path when
# k8s_lb_protocol == https. This cluster terminates TLS for *.alcedo.dev at
# Traefik via the existing cert-manager wildcard Certificate
# traefik/wildcard-alcedo-dev served through Traefik's default TLSStore. A
# Secret is namespace-scoped, so an Ingress in LEDGER_NAMESPACE cannot
# reference the traefik-owned Secret, and copying the wildcard key material
# would create an unmanaged, silently-expiring certificate copy.
---
apiVersion: v1
stringData:
  db-ledger-password: {{ LEDGER_DB_PASSWORD }}
kind: Secret
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: db-ledger-password
  name: db-ledger-password
  namespace: {{ LEDGER_NAMESPACE }}
type: Opaque
{% if LEDGER_DB_HOST == "db" %}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: db
  name: db
  namespace: {{ LEDGER_NAMESPACE }}
spec:
  ports:
  - name: "3306"
    port: 3306
    targetPort: 3306
  selector:
    io.kompose.service: db
{% endif %}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: parser
  name: parser
  namespace: {{ LEDGER_NAMESPACE }}
spec:
{% if k3s_service_type == "NodePort" %}
  type: NodePort
{% else %}
  type: ClusterIP
{% endif %}
  ports:
  - name: parser-port
    port: 5000
    targetPort: 5000
    protocol: TCP
{% if k3s_service_type == "NodePort" %}
    nodePort: 30500
{% endif %}
  selector:
    io.kompose.service: parser
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: web-svc
  name: web-svc
  namespace: {{ LEDGER_NAMESPACE }}
spec:
{% if k3s_service_type == "NodePort" %}
  type: NodePort
{% else %}
  type: ClusterIP
{% endif %}
  ports:
  - name: web-port
    port: 80
    targetPort: 80
{% if k3s_service_type == "NodePort" %}
    nodePort: 30081
{% endif %}
  selector:
    io.kompose.service: web
{% if k3s_service_type != "NodePort" %}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ LEDGER_NAMESPACE }}
  name: ledger-web-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: {{ LEDGER_HOSTNAME }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: web-svc
              port:
                number: 80
# homelab fix (#121): no spec.tls block is rendered here. Upstream placed
# `tls:` as a sibling key inside spec.rules[0] (invalid per the
# networking.k8s.io/v1 Ingress API schema) and referenced the
# namespace-local secret. This Ingress relies on Traefik's default
# TLSStore (existing cert-manager wildcard Certificate
# traefik/wildcard-alcedo-dev), so no per-namespace TLS secretName is
# needed or generated for either k8s_lb_protocol value.
{% endif %}
{% if LEDGER_DB_HOST == "db" %}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: mysql-data
  name: mysql-data
  namespace: {{ LEDGER_NAMESPACE }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ LEDGER_PVC_SIZE_GB }}Gi
# homelab fix (#121): emit storageClassName from LEDGER_PVC_STORAGE_CLASS.
# Upstream never consumed the documented variable, so the PVC silently
# bound to the cluster-default StorageClass (local-path on this cluster,
# i.e. a directory on a 30G root disk). Omitted entirely when the
# variable is undefined, preserving upstream behavior for other users.
{% if LEDGER_PVC_STORAGE_CLASS is defined %}
  storageClassName: {{ LEDGER_PVC_STORAGE_CLASS }}
{% endif %}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: db
  name: db
  namespace: {{ LEDGER_NAMESPACE }}
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/ledger-default: "true"
        io.kompose.service: db
    spec:
      # homelab fix (#121): pin ledger pods to linux/amd64 nodes. The Pro
      # ledger-db/parser/web images are linux/amd64 only (verified against
      # the Depot manifests), and this cluster has mixed amd64 + arm64
      # (homelab3) workers. Without this pin the scheduler may place a pod
      # on an arm64 worker and it will ImagePullBackOff.
      nodeSelector:
        kubernetes.io/arch: amd64
        # homelab fix (#121, plan A2b2): additionally pin the db Deployment
        # to one hostname so the mysql-data PVC binds deterministically to
        # the pre-created tower-raid5-db static PV on that node under
        # WaitForFirstConsumer (the amd64-only pin would also permit
        # workers where no MariaDB data PV exists). Hostname comes from
        # config (LEDGER_DB_NODE_HOSTNAME), not a template literal.
        kubernetes.io/hostname: {{ LEDGER_DB_NODE_HOSTNAME }}
      # homelab fix (#121, plan A2b3): fail-closed mount verification.
      # With a nofail fstab entry the worker can boot with the data disk
      # absent, leaving an empty root-filesystem directory at the
      # mountpoint — the exact lookalike hazard. This initContainer runs
      # before the db container and exits nonzero unless the filesystem
      # mounted at /var/lib/mysql carries the expected per-host UUID
      # (recorded at format time by the storage role; findmnt/UUID also
      # catches swapped scsi devices, not just absent ones). On failure
      # the pod stays Pending/CrashLoop and never writes into a
      # root-filesystem lookalike. util-linux (findmnt) is in the Rocky 9
      # base image.
      initContainers:
      - name: verify-mysql-data-mount
        command:
        - /bin/sh
        - -c
        - >-
          set -- "$(findmnt -T /var/lib/mysql -n -o UUID,FSTYPE)" || exit 1;
          [ "$1 $2" = "{{ LEDGER_DB_DATA_FS_UUID }} {{ LEDGER_DB_DATA_FS_FSTYPE | default('ext4') }}" ]
          || { echo "mysql-data mount mismatch: want {{ LEDGER_DB_DATA_FS_UUID }} {{ LEDGER_DB_DATA_FS_FSTYPE | default('ext4') }}, got $1 $2" >&2; exit 1; }
        image: {% if LEDGER_DB_IMAGE_REF is defined %}{{ LEDGER_DB_IMAGE_REF }}{% elif k8s_container_registry %}{{ k8s_container_registry | default("depot.ciq.com/ascender-pro/ascender-ledger-pro-images", true) ~ "/ledger-db" }}:{{ LEDGER_VERSION }}{% else %}{{ LEDGER_DB_IMAGE }}:{{ LEDGER_VERSION }}{% endif %}
        imagePullPolicy: {{ ascender_image_pull_policy | default("Always") }}
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: mysql-data
          readOnly: true
      containers:
      - env:
        - name: ADMIN_USER
          value: admin
        - name: MYSQL_LEDGER_PASSWORD
          value: /run/secrets/db-ledger-password
        - name: admin-password
          value: /run/secrets/admin-password
{% if LEDGER_DB_IMAGE_REF is defined %}
        image: {{ LEDGER_DB_IMAGE_REF }}
{% elif k8s_container_registry %}
        image: {{ k8s_container_registry | default("depot.ciq.com/ascender-pro/ascender-ledger-pro-images", true)  ~ "/ledger-db" }}:{{ LEDGER_VERSION }}
{% else %}
        image: {{ LEDGER_DB_IMAGE }}:{{ LEDGER_VERSION }}
{% endif %}
{% if k8s_platform == "k3s" and k8s_offline | default(false) | bool %}
        imagePullPolicy: Never
{% else %}
        imagePullPolicy: {{ ascender_image_pull_policy | default("Always") }}
{% endif %}
        name: db
        ports:
        - containerPort: 3306
          protocol: TCP
        resources: {}
        volumeMounts:
        - mountPath: /run/secrets/db-ledger-password
          name: db-ledger-password
        - mountPath: /run/secrets/admin-password
          name: admin-password
        - mountPath: /run/secrets/db-settings
          name: db-settings
        - mountPath: /var/lib/mysql
          name: mysql-data
{% if DEPOT_REGISTRY is defined %}
      imagePullSecrets:
      - name: ledger-registry-secret
{% endif %}
      restartPolicy: Always
      volumes:
      - name: db-ledger-password
        secret:
          items:
          - key: db-ledger-password
            path: db-ledger-password
          secretName: db-ledger-password
      - name: admin-password
        secret:
          items:
          - key: admin-password
            path: admin-password
          secretName: admin-password
      - name: db-settings
        secret:
          items:
          - key: config.json
            path: config.json
          secretName: db-settings
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-data
{% endif %}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: parser
  name: parser
  namespace: {{ LEDGER_NAMESPACE }}
spec:
  revisionHistoryLimit: 1
  replicas: {{ ledger_parser_replicas }}
  selector:
    matchLabels:
      io.kompose.service: parser
  strategy: {}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.28.0 (c4137012e)
      creationTimestamp: null
      labels:
        io.kompose.network/ledger-default: "true"
        io.kompose.service: parser
    spec:
      # homelab fix (#121): pin ledger pods to linux/amd64 nodes. The Pro
      # ledger-db/parser/web images are linux/amd64 only (verified against
      # the Depot manifests), and this cluster has mixed amd64 + arm64
      # (homelab3) workers. Without this pin the scheduler may place a pod
      # on an arm64 worker and it will ImagePullBackOff.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - env:
        - name: MYSQL_LEDGER_PASSWORD
          value: /run/secrets/db-ledger-password
{% if LEDGER_PARSER_IMAGE_REF is defined %}
        image: {{ LEDGER_PARSER_IMAGE_REF }}
{% elif k8s_container_registry %}
        image: {{ k8s_container_registry | default("depot.ciq.com/ascender-pro/ascender-ledger-pro-images", true)  ~ "/ledger-parser" }}:{{ LEDGER_VERSION }}
{% else %}
        image: {{ LEDGER_PARSER_IMAGE }}:{{ LEDGER_VERSION }}
{% endif %}

{% if k8s_platform == "k3s" and k8s_offline | default(false) | bool %}
        imagePullPolicy: Never
{% else %}
        imagePullPolicy: {{ ascender_image_pull_policy | default("Always") }}
{% endif %}
        name: web
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        volumeMounts:
        - mountPath: /run/secrets/db-ledger-password
          name: db-ledger-password
        - mountPath: /run/secrets/db-settings
          name: db-settings
{% if DEPOT_REGISTRY is defined %}
      imagePullSecrets:
      - name: ledger-registry-secret
{% endif %}
      restartPolicy: Always
      volumes:
      - name: db-ledger-password
        secret:
          items:
          - key: db-ledger-password
            path: db-ledger-password
          secretName: db-ledger-password
      - name: db-settings
        secret:
          items:
          - key: config.json
            path: config.json
          secretName: db-settings
---

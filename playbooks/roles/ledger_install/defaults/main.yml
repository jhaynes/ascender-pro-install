# Determines whether or not Ledger will be installed
LEDGER_INSTALL: true

# DNS resolvable hostname for Ledger service. This is required for install.
LEDGER_HOSTNAME: ledger.example.com

# The OCI container image for Ledger
LEDGER_WEB_IMAGE: depot.ciq.com/ascender-pro/ascender-ledger-pro-images/ledger-web

# The number of ledger web pods - this is good to ensure high availability
ledger_web_replicas: 1

# The OCI container image for the Ledger Parser
LEDGER_PARSER_IMAGE: depot.ciq.com/ascender-pro/ascender-ledger-pro-images/ledger-parser

# The number of ledger parser pods - this is good to ensure high availability
ledger_parser_replicas: 1

# The OCI container image for the Ledger Database
LEDGER_DB_IMAGE: depot.ciq.com/ascender-pro/ascender-ledger-pro-images/ledger-db

# The image tag indicating the version of Ledger you wish to install
LEDGER_VERSION: latest

# homelab addition (#121, digest pinning): full image references for the
# three Ledger images. When defined, each takes precedence over the
# LEDGER_*_IMAGE + LEDGER_VERSION tag composition, so an immutable
# repo:tag@sha256:<digest> reference can be pinned. Leave undefined to
# keep upstream tag behavior.
# LEDGER_WEB_IMAGE_REF: ""
# LEDGER_PARSER_IMAGE_REF: ""
# LEDGER_DB_IMAGE_REF: ""

# homelab addition (#121, plan A2b2): kubernetes.io/hostname the db
# Deployment is pinned to, for deterministic tower-raid5-db PV binding
# under WaitForFirstConsumer. Leave undefined for upstream scheduling.
# LEDGER_DB_NODE_HOSTNAME: ""

# homelab addition (#121, plan A2b3): per-host filesystem UUID (and type)
# the fail-closed db initContainer requires on the mysql-data mount,
# recorded at data-disk format time by the storage role. Leave undefined
# only when LEDGER_DB_HOST != "db" (no in-cluster db, no PVC mount).
# LEDGER_DB_DATA_FS_UUID: ""
# LEDGER_DB_DATA_FS_FSTYPE: ext4

# The Kubernetes namespace in which Ledger objects will live
LEDGER_NAMESPACE: ledger

# Admin password for Ledger (the username is admin by default)
LEDGER_ADMIN_PASSWORD: "myadminpassword"

# Host for Ledger database
LEDGER_DB_HOST: db

# Port for Ledger database
LEDGER_DB_PORT: "3306"

# Name for Ledger database
LEDGER_DB_NAME: "ledger"

# Username for Ledger database
LEDGER_DB_USERNAME: "ledger"

# Password for Ledger database
LEDGER_DB_PASSWORD: "mydbpassword"

k8s_container_registry: depot.ciq.com/ascender-pro/ascender-ledger-pro-images

ledger_service_account_name: ledger-app
